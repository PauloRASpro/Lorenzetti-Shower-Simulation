[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "lorenzetti-repro"
version = "0.1.0"
description = "Research software for Lorenzetti electron energy calibration"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "matplotlib", "lightgbm", "seaborn", "distfit"]
[project.optional-dependencies]
gnn = ["torch", "torch-geometric"]
notebooks = ["jupyterlab", "nbformat", "pillow"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
